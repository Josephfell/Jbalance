version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - gosec
    - unconvert
    - misspell

  settings:
    gosec:
      # G404 (weak random) is intentionally used in the fake pool provider
      # for local testing — it's not a real backend selection algorithm and
      # doesn't need a cryptographic RNG.
      excludes:
        - G404

  exclusions:
    rules:
      # Test files commonly ignore errors from cleanup calls (Close on a
      # connection/listener/file we're done with) — checking every one adds
      # noise without adding safety.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # gosec's "potential file inclusion via variable" (G304) fires on any
      # os.ReadFile/os.Create call using a variable path. These are
      # deliberately user/flag-provided paths (TLS cert/key files,
      # test-generated cert fixtures) — that's the intended use, not a
      # vulnerability.
      - path: internal/tlsutil/
        linters:
          - gosec
      # admin/store.go and admin/audit.go intentionally read/write
      # configurable local file paths (the admin store and audit log) and
      # store.go's own generated session secret — G304 (file path from
      # variable) and G117 (field name matches a "secret" heuristic) are
      # both expected here, not vulnerabilities.
      - path: internal/admin/(store|audit)\.go
        linters:
          - gosec
      # controlplane/overrides.go, algorithm.go, and routes.go follow the
      # same local JSON file store pattern (admin-configured, no external
      # database) — the path is operator-provided via a CLI flag, not
      # external input.
      - path: internal/controlplane/(overrides|algorithm|routes)\.go
        linters:
          - gosec
      # G124: every cookie set via http.SetCookie in this package does set
      # HttpOnly/Secure/SameSite — see session.go and handlers.go. This
      # appears to be a static-analysis limitation with struct literals
      # rather than a real missing attribute.
      - path: internal/admin/
        text: "G124:"
        linters:
          - gosec
      # log.Printf with a backend address interpolated into the message is
      # not a log-injection risk here — addresses come from the control
      # plane's own backend list, not unsanitised external input.
      - path: internal/dataplane/proxy\.go
        linters:
          - gosec
      # G118: graceful-shutdown goroutines deliberately use a fresh
      # context.Background() with its own timeout rather than the
      # already-cancelled parent context — Shutdown() needs an independent
      # deadline to drain in-flight requests. This is the standard net/http
      # graceful shutdown pattern, not a bug.
      - text: "G118:"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
